<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="userIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="18" fill="url(#userIconGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
  
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Sleek Headphones Arc -->
    <path d="M17 33 A15 15 0 0 1 47 33" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <!-- Left Ear Cup -->
    <rect x="14" y="29" width="6" height="12" rx="3" fill="#FFFFFF" />
    <!-- Right Ear Cup -->
    <rect x="44" y="29" width="6" height="12" rx="3" fill="#FFFFFF" />
    <!-- Equalizer Sound Wave in center -->
    <rect x="24" y="27" width="3" height="13" rx="1.5" fill="#FFFFFF" />
    <rect x="30.5" y="21" width="3" height="21" rx="1.5" fill="#FFFFFF" />
    <rect x="37" y="26" width="3" height="15" rx="1.5" fill="#FFFFFF" />
  </g>
</svg>
